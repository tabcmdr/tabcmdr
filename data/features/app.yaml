features:
  - Search open tabs across every window
  - Search bookmarks, history, downloads and recently closed tabs
  - 47 browser commands, including close duplicate tabs, merge windows and suspend inactive tabs
  - 208 shortcuts for GitHub, GitLab, Gmail, Notion, Figma, Jira, Discord, YouTube and X
  - Calculator, unit conversion, time zones, date math and Unix timestamps
  - AI chat with ChatGPT, Claude, Gemini, Grok, Groq, DeepSeek, Mistral, Perplexity and OpenRouter using your own API key
  - Emoji picker, to-do list, RSS reader, weather, screenshots, color picker, ruler and QR codes
  - 28 themes and 3 layouts
  - No account, no analytics, browsing data stays on your device
