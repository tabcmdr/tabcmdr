tours:
  hub:
    steps:
      - { label: "Switch tabs", icon: i-search, query: "pull", target: t1, caption: "Type part of a title or address. Tabs from every window match, and Enter takes you there." }
      - { label: "Bookmarks", icon: i-bookmark, query: ":b tokens", target: b2, caption: "Start with :b to search only your bookmarks. No folders to click through." }
      - { label: "History", icon: i-history, query: ":h invoice", target: h1, caption: ":h searches your browsing history without opening the history page." }
      - { label: "Closed tabs", icon: i-undo, query: ":r", target: r1, caption: ":r lists the tabs you closed, newest first. Enter opens one again." }
      - { label: "Commands", icon: i-terminal, query: ":c dup", target: "Close Duplicate Tabs", caption: "Commands act on your tabs. Close Duplicate Tabs keeps one copy of each page." }
      - { label: "Calculator", icon: i-calculator, query: "20% of 4500", target: answer, caption: "Math and conversions answer as you type. Enter copies the result." }
      - { label: "Time zones", icon: i-clock, query: "time in tokyo", target: answer, caption: "Ask for the time in a city. The answer uses your clock, so it's always current." }
  tabs:
    steps:
      - { label: "Switch tabs", icon: i-search, query: "pull", target: t1, caption: "Type part of a title or address and press Enter. The tab comes to the front." }
      - { label: "Other windows", icon: i-layers, query: "vercel", target: t16, caption: "Tabs in your other windows are in the same list. Enter brings that window to the front." }
      - { label: "Typos", icon: i-search, query: "onbording", target: t4, caption: "Words of five letters or more allow a typo, so a misspelled word still finds the tab." }
      - { label: "Pinned tabs", icon: i-pin, query: ":p", target: t14, caption: ":p lists only your pinned tabs, from every window." }
  bookmarks:
    start: { filter: bookmarks }
    steps:
      - { label: "By name", icon: i-bookmark, query: ":b tokens", target: b2, caption: "Start with :b to search only your bookmarks. Enter opens the bookmark in a new tab." }
      - { label: "By folder", icon: i-layers, query: ":b design", target: b5, caption: "Folder names count too, so :b design finds bookmarks filed under a Design folder." }
      - { label: "By address", icon: i-globe, query: ":b caniuse", target: b7, caption: "Part of the address works as well as the title." }
      - { label: "Browse all", icon: i-sliders, filter: bookmarks, query: "", target: b3, caption: "Press Tab to step to the Bookmarks filter and browse every bookmark, with its folder." }
  history:
    start: { filter: history }
    steps:
      - { label: "Search history", icon: i-history, query: ":h invoice", target: h1, caption: ":h searches the pages you visited, newest first, with when you were last there." }
      - { label: "Any word", icon: i-search, query: ":h lisbon", target: h3, caption: "Type any word you remember from the title or the address." }
      - { label: "In every search", icon: i-layers, query: "sprint", target: h7, caption: "History also shows up in a normal search, up to five pages under your tabs." }
      - { label: "Browse history", icon: i-sliders, filter: history, query: "", target: h1, caption: "The History filter lists your recent history, newest first." }
  closed:
    start: { filter: closed }
    steps:
      - { label: "Reopen a tab", icon: i-undo, query: ":r", target: r1, caption: ":r lists the tabs you closed, newest first. Enter opens one again." }
      - { label: "Search closed tabs", icon: i-search, query: ":r lisbon", target: r2, caption: "Type a word to find a closed tab by its title or address." }
      - { label: "In every search", icon: i-layers, query: "sourdough", target: r3, caption: "Closed tabs also match in a normal search, right below your open tabs." }
      - { label: "Undo Close Tab", icon: i-terminal, query: ":c undo", target: "Undo Close Tab", caption: "Undo Close Tab brings back the last tab you closed, without opening the list." }
  downloads:
    start: { filter: downloads }
    steps:
      - { label: "Open a file", icon: i-file, query: ":d invoice", target: d1, caption: ":d searches your recent downloads by file name. Enter opens the file." }
      - { label: "Copy source URL", icon: i-link, query: ":d brand", target: d2, action: copy-download-url, caption: "Copy source URL gives you the address the file was downloaded from." }
      - { label: "Remove from list", icon: i-x, query: ":d contract", target: d6, action: erase-download, caption: "Remove from list clears the entry from your downloads list. The file on disk stays." }
      - { label: "Browse downloads", icon: i-sliders, filter: downloads, query: "", target: d1, caption: "The Downloads filter lists your last 100 downloads, including ones still in progress." }
  search:
    start: { query: ":s tailwind grid" }
    steps:
      - { label: "Search the web", icon: i-globe, query: ":s tailwind grid", target: 'Search "tailwind grid" on Google', caption: ":s turns the search box into a web search. Enter opens the results in a new tab." }
      - { label: "Pick an engine", icon: i-search, query: "css has selector", target: 'Search "css has selector" on DuckDuckGo', caption: "Any search ends with your search engines, so you can pick one with the arrow keys." }
      - { label: "Open an address", icon: i-arrow-up-right, query: "github.com/acme/web/issues", target: "Open github.com/acme/web/issues", caption: "Type an address and TabCmdr offers to open it in a new tab." }
