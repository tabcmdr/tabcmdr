groups:
  - id: sources
    label: "Search one place"
    note: "Add words after it"
    items:
      - token: ":t"
        title: "Open tabs"
        text: "Tabs from every window, plus commands."
        scene: source
        source: tabs
        query: "pull"
        tries: ["pull", "figma", "inbox"]
        info: "Searches the open tabs in every window by title and address. Pinned tabs and matching commands show up too. Enter switches to the tab."
        link: "/features/search-open-tabs/"
      - token: ":b"
        title: "Bookmarks"
        text: "Every saved bookmark, without opening folders."
        scene: source
        source: bookmarks
        query: "design"
        tries: ["design", "okr", "react"]
        info: "Searches every bookmark by name, address and folder, and shows where each one is filed. Enter opens it in a new tab."
        link: "/features/search-bookmarks/"
      - token: ":h"
        title: "History"
        text: "Pages you visited, by title or address."
        scene: source
        source: history
        query: "invoice"
        tries: ["invoice", "lisbon", "linear"]
        info: "Searches the pages you visited by title and address, newest first. Enter opens the page in a new tab."
        link: "/features/search-history/"
      - token: ":d"
        title: "Downloads"
        text: "Find a file, show it in its folder or copy its source."
        scene: source
        source: downloads
        query: "invoice"
        tries: ["invoice", "csv", "roadmap"]
        info: "Searches your last 100 downloads by file name. Enter opens the file, or shows it in its folder while it's still downloading or missing."
        link: "/features/search-downloads/"
      - token: ":r"
        title: "Recently closed"
        text: "Tabs you closed, newest first."
        scene: source
        source: closed
        query: ""
        tries: ["lisbon", "notes"]
        info: "Lists the tabs you closed, newest first, with how long ago you closed each one. Enter reopens the tab."
        link: "/features/recently-closed-tabs/"
      - token: ":p"
        title: "Pinned tabs"
        text: "Only the tabs you pinned."
        scene: source
        source: pinned
        query: ""
        tries: ["slack", "calendar"]
        info: "Lists only your pinned tabs, from every window. Enter switches to the tab."
        link: "/features/search-open-tabs/"
      - token: ":c"
        title: "Commands"
        text: "The 47 browser commands, and site shortcuts on supported sites."
        scene: source
        source: commands
        query: "close"
        tries: ["close", "zoom", "screenshot"]
        info: "Lists all 47 browser commands, from Zoom In to Close Duplicate Tabs. Enter runs the highlighted one."
        link: "/features/close-duplicate-tabs/"
      - token: ":s"
        title: "Web search"
        text: "Search Google, Bing, DuckDuckGo, Brave or Yahoo."
        scene: source
        source: search
        query: "tailwind grid"
        tries: ["tailwind grid", "weather lisbon"]
        info: "Turns what you typed into a search on Google, Bing or DuckDuckGo. Yahoo and Brave Search can be turned on in settings. Enter searches with the highlighted engine."
        link: "/features/web-search/"
  - id: tools
    label: "Open a tool"
    note: "Opens as you type it"
    items:
      - token: ":ai"
        title: "AI chat"
        text: "Chat with the provider you set as default."
        scene: ai
        info: "Opens a chat with the provider you set as default, using your own API key. Add @page and the page you're on goes along with your message. The replies here are samples."
        link: "/features/#ai"
      - token: ":emoji"
        alias: ":em"
        title: "Emoji"
        text: "Search emoji by name and copy one."
        scene: emoji
        query: ""
        tries: ["rocket", "heart", "thumbs"]
        info: "Search 1,900+ emoji by name and pick a skin tone. Enter copies the emoji, and Shift+Enter copies its :name: instead."
        link: "/features/#tools"
      - token: ":todo"
        alias: ":td"
        title: "To-do list"
        text: "Add a task, check it off later."
        scene: todo
        info: "Type a task and press Enter to save it. Check tasks off, delete them, or clear everything you've finished."
        link: "/features/#tools"
      - token: ":rss"
        title: "RSS reader"
        text: "Latest headlines from your feeds."
        scene: rss
        info: "Shows the latest articles from your feeds, newest first. Six feeds come set up and you can add your own. Pick a feed to see only its articles."
        link: "/features/#tools"
      - token: ":wx"
        title: "Weather"
        text: "Current conditions for your places."
        scene: weather
        query: ""
        tries: ["london", "tokyo"]
        info: "Shows current conditions for your places from Open-Meteo, with no API key to set up. Add up to 15 places in settings, and type to filter them."
        link: "/features/#tools"
      - token: ":ss"
        title: "Screenshot"
        text: "Capture the page or a selected area."
        scene: screenshot
        info: "Copies or saves the visible page, an area you draw, or the full page as a PNG. Area commands let you draw a selection on the page first."
        link: "/features/#tools"
      - token: ":cp"
        title: "Color picker"
        text: "Sample a color from the screen."
        scene: colorpicker
        info: "Move over the page to see the HEX and RGB values under your cursor. Click to copy the hex code, or press Esc to cancel."
        link: "/features/#tools"
      - token: ":rl"
        title: "Ruler"
        text: "Measure elements and drag guides."
        scene: ruler
        info: "Hover an element to see its tag and size. Click to select it, then hover another element to see the gap between them. Press C to copy the selected size."
        link: "/features/#tools"
  - id: answers
    label: "Get an answer"
    note: "Enter copies it"
    items:
      - token: ":tx"
        title: "Text case"
        text: "UPPER, lower, Title, camelCase, snake_case and more."
        scene: answer
        query: "launch plan"
        tries: ["launch plan", "userId"]
        info: "Turns your text into seven case styles, from UPPER CASE to kebab-case. Click a result or press Enter to copy it."
        link: "/features/#answers"
      - token: ":uuid"
        title: "UUID"
        text: "A new v4 UUID, ready to copy."
        scene: answer
        query: ""
        refresh: true
        info: "Makes a new random v4 UUID each time. Click it or press Enter to copy it."
        link: "/features/#answers"
      - token: ":pwd"
        title: "Password"
        text: "A random password. Add a length, like :pwd 24."
        scene: answer
        query: "24"
        tries: ["16", "24", "20 a", "8 n"]
        info: "Makes a random password, 16 characters by default. Add a length like :pwd 24, then a for letters and digits only, c for letters only or n for digits only."
        link: "/features/#answers"

ai:
  provider: "anthropic · claude-3-5-sonnet-20241022"
  prompts:
    - text: "summarize @page"
      title: "Q3 roadmap: summary"
      body: "The doc sets three goals for the quarter, each with an owner and a date: ship onboarding flow v3 by August 15, move every plan to the new checkout, and bring dashboard load time under 2 s."
    - text: "turn @page into a checklist"
      title: "Q3 roadmap checklist"
      body: "1. Finish the onboarding flow v3 designs. 2. Fix ENG-482, the sticky header on Safari. 3. Launch the new checkout for all plans. 4. Get dashboard load time under 2 s."
    - text: "translate the intro of @page to Spanish"
      title: "Introducción"
      body: "Este trimestre nos centramos en tres metas: lanzar el nuevo flujo de bienvenida, pasar la facturación al nuevo proceso de pago y reducir el tiempo de carga del panel a menos de dos segundos."

